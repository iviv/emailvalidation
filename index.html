<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Email Validator - SPF/DKIM/DMARC Analyzer</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <div class="container">
        <header>
            <h1>Email Validator</h1>
            <p>Analyze SPF, DKIM, DMARC, and ARC authentication headers</p>
        </header>

        <main>
            <section class="upload-section">
                <h2>Upload Email File</h2>
                <input type="file" id="fileInput" accept=".eml,.txt" />
            </section>

            <section class="results-section" id="resultsSection" style="display: none;">
                <h2>Analysis Results</h2>
                <div id="emailTree" class="email-tree"></div>
            </section>

            <section class="debug-section" id="debugSection" style="display: none;">
                <h2>Debug Log</h2>
                <div id="debugLog" class="debug-log"></div>
            </section>

            <section class="error-section" id="errorSection" style="display: none;">
                <div class="error-message" id="errorMessage"></div>
            </section>
        </main>

        <footer>
            <p>Email Validator - Analyzes email authentication headers</p>
        </footer>
    </div>

    <script src="parser.js"></script>
    <script src="renderer.js"></script>
    <script src="main.js"></script>
</body>
</html>
